<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSwurve Viral Stream Overlay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      user-select: none;
    }

    /* Video Container */
    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }

    /* Streamer Raw Webcam */
    #webcam-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Mirror camera by default */
      z-index: 1;
      transition: filter 0.3s ease;
    }

    #webcam-video.unmirrored {
      transform: scaleX(1);
    }

    /* Pre-Rendered Viral Video Layer (Transitions over webcam) */
    #clip-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 2;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #clip-video.active {
      opacity: 1;
    }

    /* Streamer HUD Banner */
    #hud-banner {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 18px;
      background: rgba(10, 14, 26, 0.82);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      color: #fff;
      font-size: 13px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }

    #hud-banner.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .hud-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      box-shadow: 0 0 12px rgba(236, 72, 153, 0.5);
    }

    .hud-text {
      font-weight: 600;
      color: #f1f5f9;
      letter-spacing: 0.2px;
    }

    /* Permission / Click to Start Modal */
    #start-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10, 12, 22, 0.92);
      backdrop-filter: blur(16px);
      color: #fff;
      text-align: center;
      padding: 24px;
      cursor: pointer;
    }

    #start-modal.active {
      display: flex;
    }

    .modal-icon {
      font-size: 48px;
      margin-bottom: 16px;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    .btn-start {
      margin-top: 20px;
      padding: 12px 28px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      border: none;
      border-radius: 999px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 0 24px rgba(236, 72, 153, 0.5);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="stage">
    <!-- Streamer Live Webcam Feed -->
    <video id="webcam-video" autoplay playsinline muted></video>

    <!-- Offline / Feed Disconnected Overlay -->
    <div id="offline-screen" style="position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 50; display: none; flex-direction: column; align-items: center; justify-content: center; color: #64748b; font-size: 16px; font-weight: 700; letter-spacing: 1px;">
      <span style="font-size: 32px; margin-bottom: 8px;">🛑</span>
      <span>FEED DISCONNECTED / OFFLINE</span>
      <span style="font-size: 12px; color: #475569; margin-top: 6px;">Enable from Dashboard Controller</span>
    </div>

    <!-- Viral Pre-Rendered AI Video Layer -->
    <video id="clip-video" playsinline></video>

    <!-- On-Air Notification HUD -->
    <div id="hud-banner">
      <span class="hud-badge">🎬 ON AIR</span>
      <span id="hud-title" class="hud-text">Playing Viral VFX</span>
    </div>

    <!-- Start / Camera Permission Overlay -->
    <div id="start-modal">
      <div class="modal-icon">📷</div>
      <h2 style="font-size: 22px; font-weight: 700; margin-bottom: 8px;">Click to Activate Camera Overlay</h2>
      <p style="color: #94a3b8; font-size: 13px; max-width: 420px; line-height: 1.5;">
        Browser requires user interaction to enable webcam and audio playback for OBS Studio and live streams.
      </p>
      <button class="btn-start">Activate Camera Feed</button>
    </div>
  </div>

  <script>
    // URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const hideHudParam = urlParams.get("hud") === "0";
    const unmirrorParam = urlParams.get("mirror") === "0";

    const webcamVideo = document.getElementById("webcam-video");
    const clipVideo = document.getElementById("clip-video");
    const hudBanner = document.getElementById("hud-banner");
    const hudTitle = document.getElementById("hud-title");
    const startModal = document.getElementById("start-modal");

    if (unmirrorParam) {
      webcamVideo.classList.add("unmirrored");
    }

    let isHudDisabled = hideHudParam;
    let localStream = null;
    let ws = null;
    let hudTimeout = null;

    // -------------------------------------------------------------------------
    // 1. Webcam Initialization
    // -------------------------------------------------------------------------
    async function initCamera() {
      if (localStream) return true;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 1920, min: 1280 },
            height: { ideal: 1080, min: 720 },
            frameRate: { ideal: 60, min: 30 }
          },
          audio: false
        });
        localStream = stream;
        webcamVideo.srcObject = stream;
        await webcamVideo.play();
        startModal.classList.remove("active");
        console.log("Webcam started successfully.");
        return true;
      } catch (err) {
        console.warn("High-res camera failed, falling back to standard resolution:", err);
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          localStream = fallbackStream;
          webcamVideo.srcObject = fallbackStream;
          await webcamVideo.play();
          startModal.classList.remove("active");
          return true;
        } catch (fallbackErr) {
          console.error("Camera access denied or unavailable:", fallbackErr);
          startModal.classList.add("active");
          return false;
        }
      }
    }

    startModal.addEventListener("click", () => {
      initCamera();
    });

    // -------------------------------------------------------------------------
    // 2. Seamless Viral Clip Playback
    // -------------------------------------------------------------------------
    function playClip(url, title, user, detail) {
      if (!clipVideo) return;
      console.log("Playing clip:", url, title);
      clipVideo.src = url;
      clipVideo.currentTime = 0;
      clipVideo.classList.add("active");

      clipVideo.play().catch(e => {
        console.warn("Auto-play error (click stream to allow audio):", e);
        // Retry muted if audio policy blocked it
        clipVideo.muted = true;
        clipVideo.play();
      });

      if (!isHudDisabled) {
        let label = title || "Viral VFX";
        if (user) label += ` • ${user}`;
        if (detail) label += ` (${detail})`;
        hudTitle.textContent = label;
        hudBanner.classList.add("visible");

        if (hudTimeout) clearTimeout(hudTimeout);
        hudTimeout = setTimeout(() => {
          hudBanner.classList.remove("visible");
        }, 5000);
      }
    }

    function stopClip() {
      if (!clipVideo) return;
      clipVideo.classList.remove("active");
      hudBanner.classList.remove("visible");
      setTimeout(() => {
        clipVideo.pause();
        clipVideo.src = "";
      }, 300);
    }

    clipVideo.onended = () => {
      console.log("Clip finished naturally. Returning to webcam.");
      stopClip();
    };

    // -------------------------------------------------------------------------
    // 3. Hotkeys (H to toggle HUD, Space / Escape to stop clip)
    // -------------------------------------------------------------------------
    window.addEventListener("keydown", (e) => {
      if (e.key === "h" || e.key === "H") {
        isHudDisabled = !isHudDisabled;
        if (isHudDisabled) hudBanner.classList.remove("visible");
      }
      if (e.key === "Escape" || e.key === " ") {
        stopClip();
      }
    });

    // -------------------------------------------------------------------------
    // 4. WebSocket Hub Connection
    // -------------------------------------------------------------------------
    function connectWebSocket() {
      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const wsUrl = `${protocol}//${window.location.host}/ws?client=overlay`;
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        console.log("Connected to Stream Controller WebSocket.");
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          switch (data.type) {
            case "status_sync":
              if (data.feed_enabled !== undefined) {
                setFeedState(data.feed_enabled);
              }
              break;
            case "feed_status":
              setFeedState(data.enabled);
              break;
            case "play_clip":
              playClip(data.url, data.name || data.clip, data.user, data.detail);
              break;
            case "stop_clip":
              stopClip();
              break;
          }
        } catch (e) {
          console.error("WebSocket message parse error:", e);
        }
      };

      ws.onclose = () => {
        setTimeout(connectWebSocket, 2000);
      };
    }

    function setFeedState(enabled) {
      const offlineScreen = document.getElementById("offline-screen");
      if (!enabled) {
        if (offlineScreen) offlineScreen.style.display = "flex";
        stopClip();
        if (webcamVideo) webcamVideo.style.opacity = "0";
      } else {
        if (offlineScreen) offlineScreen.style.display = "none";
        if (webcamVideo) webcamVideo.style.opacity = "1";
        if (!localStream) initCamera();
      }
    }

    // Startup
    window.addEventListener("DOMContentLoaded", () => {
      initCamera();
      connectWebSocket();
    });
  </script>
</body>
</html>
